description: Creates an Unum in DigitalOcean
input:
  craft: unum
  fields:
  - name: unum
    description: name of the Unum
    validation: ^[a-z][a-z0-9\-]{1,32}$
    required: true
output:
  code:
  - github:
      repo: "unifist/platform"
    change:
    - github:
        repo: unifist/infra-forge
      content:
      - source: unum/do
        destination: "unums/{{ unum }}/do"
    - github:
        repo: unum-pillars/argocd
        branch: 0.1.3
      content:
      - source: pillar/do
        destination: "unums/{{ unum }}/pillars/argocd"
    - github:
        repo: unum-apps/ledger
        branch: 0.1.4rc1
      content:
      - source: app/do
        destination: "unums/{{ unum }}/apps/ledger"
    - github:
        repo: unum-origins/discord
        branch: 0.1.1rc1
      content:
      - source: origin/do
        destination: "unums/{{ unum }}/origins/discord"
    - github:
        repo: unum-apps/feelz
        branch: 0.1.0rc1
      content:
      - source: app/do
        destination: "unums/{{ unum }}/apps/feelz"
    - github:
        repo: unum-apps/ayaye
        branch: 0.1.0rc1
      content:
      - source: app/do
        destination: "unums/{{ unum }}/apps/ayaye"
